name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/verify-native-helpers.mjs
      - if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # Build the Job Object helper so the win32-gated suites exercise the
      # real fail-closed spawn path; the committed binary ships separately.
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir native\build
          copy native\bin\win32-filesystem-x64.exe native\build\win32-filesystem-x64-reviewed.exe
          zig cc -target x86_64-windows-gnu -O2 -s -municode -Wl,/Brepro native\win32-filesystem.c -ladvapi32 -o native\bin\win32-filesystem-x64.exe
          fc /b native\build\win32-filesystem-x64-reviewed.exe native\bin\win32-filesystem-x64.exe
          cl /O2 /W4 native\win32-job-kill.c /Fe:native\bin\win32-job-kill-x64.exe
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # validate-release runs `claude plugin validate`; the CLI is not on
      # hosted runners, so install it for the POSIX legs.
      - if: runner.os != 'Windows'
        run: npm install -g @anthropic-ai/claude-code
      - if: runner.os != 'Windows'
        run: bash scripts/validate-release.sh
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: win32-job-kill-x64
          path: native/bin/win32-job-kill-x64.exe
          if-no-files-found: error

  windows-arm64-filesystem:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/verify-native-helpers.mjs
      - uses: mlugg/setup-zig@v2
        with: { version: 0.15.2 }
      - shell: cmd
        run: |
          mkdir native\build
          copy native\bin\win32-job-kill-arm64.exe native\build\win32-job-kill-arm64-reviewed.exe
          copy native\bin\win32-filesystem-arm64.exe native\build\win32-filesystem-arm64-reviewed.exe
          zig cc -target aarch64-windows-gnu -O2 -s -Wl,/Brepro native\win32-job-kill.c -o native\bin\win32-job-kill-arm64.exe
          zig cc -target aarch64-windows-gnu -O2 -s -municode -Wl,/Brepro native\win32-filesystem.c -ladvapi32 -o native\bin\win32-filesystem-arm64.exe
          fc /b native\build\win32-job-kill-arm64-reviewed.exe native\bin\win32-job-kill-arm64.exe
          fc /b native\build\win32-filesystem-arm64-reviewed.exe native\bin\win32-filesystem-arm64.exe
      - run: npm ci
      - run: npx vitest run tests/runtime/windows-job-kill.test.ts tests/runtime/windows-filesystem-helper.test.ts tests/runtime/durable-directory.test.ts tests/runtime/worktree-manager.test.ts tests/runtime/recovery-manager.test.ts --maxWorkers=2
